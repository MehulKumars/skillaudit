name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest   # Ubuntu 26.04 images no longer provide Python 3.9
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Single-file build smoke test
        run: |
          python build_pyz.py
          python dist/skillaudit.pyz --version
          python dist/skillaudit.pyz --list-rules

  redos:
    name: ReDoS / performance probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tests/perf_redos.py 20
